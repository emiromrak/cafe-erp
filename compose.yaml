name: cafe-erp

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafe_erp}
      POSTGRES_USER: ${POSTGRES_USER:-cafe_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: cafe-erp:local
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cafe_erp}
      POSTGRES_USER: ${POSTGRES_USER:-cafe_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
      CAFE_LATITUDE: ${CAFE_LATITUDE:-40.99}
      CAFE_LONGITUDE: ${CAFE_LONGITUDE:-29.03}
    volumes:
      - ./data:/app/data
      - ./backend/app/ai/models:/app/backend/app/ai/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  telegram:
    image: cafe-erp:local
    build: .
    profiles: ["telegram"]
    command: ["python", "backend/app/ai/telegram_bot.py"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cafe_erp}
      POSTGRES_USER: ${POSTGRES_USER:-cafe_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      CAFE_LATITUDE: ${CAFE_LATITUDE:-40.99}
      CAFE_LONGITUDE: ${CAFE_LONGITUDE:-29.03}
      CAFE_LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data:ro
      - ./backend/app/ai/models:/app/backend/app/ai/models:ro
      - telegram-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  telegram-logs:
  postgres-data:
